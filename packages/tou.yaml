# --- POCZĄTEK PLIKU TOU ---
# Wersja v1.02 - Korekta Time of Use dla Hackman Flex3L.
# Zmiany: Dodanie filtru multiply: 0.1 do wszystkich encji napięciowych (V) i prądowych/mocy (W), aby zniwelować błędy przeskalowania rzędu 120000 W i 490 V.

time:
  - platform: sntp
    id: sntp_time

number:
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "Time of Use All Voltage"
    address: 231
    unit_of_measurement: "V"
    device_class: voltage
    value_type: U_WORD
    multiply: 0.1
    min_value: 38
    max_value: 61
    step: 0.1
    entity_category: config
    mode: box
    icon: "mdi:flash"

  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "Time of Use All Out Power"
    address: 232
    unit_of_measurement: "W"
    device_class: power
    value_type: U_WORD
    multiply: 0.1
    min_value: 0
    max_value: 12000
    step: 100
    entity_category: config
    mode: box
    icon: "mdi:lightning-bolt"

  - platform: modbus_controller
