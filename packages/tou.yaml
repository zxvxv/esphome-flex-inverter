switch:
  - platform: template
    name: "Time of Use"
    icon: "mdi:toggle-switch"
    optimistic: true
    restore_mode: DISABLED
    entity_category: config
    lambda: "return ((int)id(hackman_flex3l_time_of_use_enabled_raw).state & 0b00000001) != 0;"
    turn_on_action:
      - number.set:
          id: hackman_flex3l_time_of_use_enabled_raw
          value: !lambda "return (int)id(hackman_flex3l_time_of_use_enabled_raw).state | 0b00000001;"
    turn_off_action:
