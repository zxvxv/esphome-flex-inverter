# Wersja v4.00 - Powrót do natywnego Modbusa (Ostateczna kalibracja U_WORD).
# Zmiany: Całkowicie porzucono architekturę wirtualnych szablonów, która powodowała błędy kompilacji. Przywrócono czyste encje modbus_controller. Nałożono multiply: 0.1 dla Napięcia i Mocy, aby skompensować jednostki 0.1 falownika. Ograniczono moc do 6500 W (limit fizyczny 16-bitowego rejestru Modbus, który zapobiega odrzucaniu ramek i odskakiwaniu suwaków).
# Wersja v5.00 - Architektura "Ninja" dla Napięć, usunięcie limitów Mocy.
# Zmiany: Całkowicie wycięto sekcję nastaw Mocy (Out Power) ze względu na błędy 16-bitowego limitu sprzętowego. 
# Wprowadzono architekturę z ukrytym rejestrem (internal: true) dla napięć (adresy 260-265), które przyjmują wartości surowe (np. 490),
# a do Home Assistanta wystawiono bezpieczne wirtualne suwaki template, pokazujące poprawne wartości w woltach (np. 49.0 V) bez psucia zapisu.
# Encje SoC zachowano w 100% natywnie.

