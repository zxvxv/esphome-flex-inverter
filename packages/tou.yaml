number:
  # === TEMPLATE NUMBERS DLA HA (WIRTUALNE SUWAKI) ===
  # Te encje wystają do Home Assistanta. Skalują wartości z Modbusa w obie strony x10, chroniąc natywny zapis.
  
  - platform: template
    name: "Time of Use 1 Voltage"
    id: hackman_flex3l_time_of_use_1_voltage
    unit_of_measurement: "V"
    device_class: voltage
    min_value: 38.0
    max_value: 62.0
    step: 0.1
    entity_category: config
    mode: box
    icon: "mdi:flash"
    lambda: |-
      if (id(hackman_flex3l_time_of_use_1_voltage_raw).has_state()) {
        return id(hackman_flex3l_time_of_use_1_voltage_raw).state * 0.1;
      } else {
