# --- POCZĄTEK PLIKU TOU ---
# Wersja v1.03 - Dodanie brakujących atrybutów ID.
# Zmiany: Wstrzyknięcie unikalnych identyfikatorów 'id' (prefiks hackman_flex3l_) dla każdej encji, aby zapobiec błędom kompilatora przy odwołaniach. Utrzymano mnożniki 0.1 dla mocy i napięć.

time:
  - platform: sntp
    id: sntp_time

number:
  - platform: modbus_controller
    use_write_multiple: true
    modbus_controller_id: ${modbus_controller_id}
    name: "Time of Use All Voltage"
    id: hackman_flex3l_time_of_use_all_voltage
    address: 231
    unit_of_measurement: "V"
    device_class: voltage
    value_type: U_WORD
    multiply: 0.1
    min_value: 38
    max_value: 61
    step: 0.1
    entity_category: config
    mode: box
    icon: "mdi:flash"

  - platform: modbus_controller
