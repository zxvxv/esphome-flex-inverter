# --- POCZĄTEK PLIKU AUTOMATIONS ---
# Wersja v1.08 - Zmiana odczytu dla automatyzacji chłodzenia z DC na AC Temperature.
# Zmiany: Tryb 4 odczytuje teraz zmienną hackman_flex3l_inverter_ac_temperature.
# Wersja v1.07 - Dodanie trybu chłodzenia inwertera z definiowalną histerezą temperatury.
# Zmiany: Rozbudowa encji select o tryb "Chłodzenie Inwertera". Dodanie encji number do sterowania progami temperatury załączenia i wyłączenia.
# Wersja v1.06 - Poprawka kompatybilności dla ESPHome 2026.7.4.
# Zmiany: Usunięcie odwołań do właściwości .state w TemplateSelect na rzecz .active_index() omijając błąd kompilatora. Zabezpieczenie lambdy przed pustym odczytem.
# Wersja v1.05 - Ominięcie błędów duplikatów w cache ESPHome.
# Zmiany: Dodanie unikalnych sufiksów (Stycznik) do wszystkich nazw encji (select, number), aby wymusić czystą kompilację.
# Zmiany: Zmiana trybu wprowadzania wartości na 'box' (okienko) dla wszystkich encji number.
# Zmiany: Dostosowanie ID do wyczyszczonego pliku battery.yaml (id: battery_soc).

switch:
  - platform: gpio
    pin: GPIO47
    id: waveshare_relay
    name: "Stycznik Zewnętrzny (GPIO47)"
    restore_mode: ALWAYS_OFF
    icon: "mdi:relay"

select:
  - platform: template
    name: "Tryb pracy przekaźnika (Stycznik)"
    id: relay_mode
    optimistic: true
    options:
      - "Wyłączony"
      - "Ręczny"
      - "Przepięcie Sieci"
      - "Nadmiar Baterii"
      - "Chłodzenie Inwertera"
    initial_option: "Wyłączony"
    icon: "mdi:state-machine"

number:
  - platform: template
    name: "Napięcie załączenia (Stycznik)"
    id: relay_volt_on
    optimistic: true
    min_value: 240
    max_value: 260
    step: 0.1
    initial_value: 251.0
    unit_of_measurement: "V"
    icon: "mdi:lightning-bolt"
    mode: box

  - platform: template
    name: "Napięcie wyłączenia (Stycznik)"
    id: relay_volt_off
    optimistic: true
    min_value: 230
    max_value: 255
    step: 0.1
    initial_value: 248.0
    unit_of_measurement: "V"
    icon: "mdi:lightning-bolt-outline"
    mode: box

  - platform: template
    name: "Bateria SOC załączenia (Stycznik)"
    id: relay_soc_on
    optimistic: true
    min_value: 50
    max_value: 100
    step: 1
    initial_value: 98
    unit_of_measurement: "%"
    icon: "mdi:battery-arrow-up"
    mode: box

  - platform: template
    name: "Bateria SOC wyłączenia (Stycznik)"
    id: relay_soc_off
    optimistic: true
    min_value: 40
    max_value: 99
    step: 1
    initial_value: 90
    unit_of_measurement: "%"
    icon: "mdi:battery-arrow-down"
    mode: box

  - platform: template
    name: "Temperatura załączenia (Stycznik)"
    id: relay_temp_on
    optimistic: true
    min_value: 20
    max_value: 80
    step: 1
    initial_value: 44.0
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-chevron-up"
    mode: box

  - platform: template
    name: "Temperatura wyłączenia (Stycznik)"
    id: relay_temp_off
    optimistic: true
    min_value: 20
    max_value: 80
    step: 1
    initial_value: 41.0
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-chevron-down"
    mode: box

interval:
  - interval: 5s
    then:
      - lambda: |-
          // Pobieramy indeks z encji select (zwraca typ optional)
          auto mode_opt = id(relay_mode).active_index();
          // Jeżeli zmienna nie ma przypisanego indeksu, ustawiamy 0 (Wyłączony) jako wartość bezpieczną
          int mode_idx = mode_opt.has_value() ? mode_opt.value() : 0;

          // 1. Tryb: Wyłączony (twardy OFF) - opcja nr 0
          if (mode_idx == 0) {
            if (id(waveshare_relay).state) {
              id(waveshare_relay).turn_off();
            }
          }
          // 2. Tryb: Ręczny (ignoruje automatykę, sterujesz klikając z WWW) - opcja nr 1
          else if (mode_idx == 1) {
            // Nic nie rób, czekaj na kliknięcie użytkownika
          }
          // 3. Tryb: Przepięcie Sieci (Histereza V) - opcja nr 2
          else if (mode_idx == 2) {
            // Zostawiamy oryginalne przedrostki dla sieci, bo nie czyściliśmy pliku grid.yaml
            float v1 = id(hackman_flex3l_grid_voltage_l1).state;
            float v2 = id(hackman_flex3l_grid_voltage_l2).state;
            float v3 = id(hackman_flex3l_grid_voltage_l3).state;
            
            // Znajdź najwyższe napięcie z 3 faz
            float max_v = v1;
            if (v2 > max_v) max_v = v2;
            if (v3 > max_v) max_v = v3;

            // Logika histerezy
            if (max_v >= id(relay_volt_on).state) {
              if (!id(waveshare_relay).state) id(waveshare_relay).turn_on();
            } else if (max_v <= id(relay_volt_off).state) {
              if (id(waveshare_relay).state) id(waveshare_relay).turn_off();
            }
          }
          // 4. Tryb: Nadmiar Baterii (Histereza SOC) - opcja nr 3
          else if (mode_idx == 3) {
            // Używamy wyczyszczonego ID baterii z pliku battery.yaml
            float soc = id(battery_soc).state;
            
            if (soc >= id(relay_soc_on).state) {
              if (!id(waveshare_relay).state) id(waveshare_relay).turn_on();
            } else if (soc <= id(relay_soc_off).state) {
              if (id(waveshare_relay).state) id(waveshare_relay).turn_off();
            }
          }
          // 5. Tryb: Chłodzenie Inwertera (Histereza Temperatury) - opcja nr 4
          else if (mode_idx == 4) {
            // Odczytujemy temperaturę po przypisanym ID
            float temp = id(hackman_flex3l_inverter_ac_temperature).state;
            
            if (temp >= id(relay_temp_on).state) {
              if (!id(waveshare_relay).state) id(waveshare_relay).turn_on();
            } else if (temp <= id(relay_temp_off).state) {
              if (id(waveshare_relay).state) id(waveshare_relay).turn_off();
            }
          }
# --- KONIEC PLIKU AUTOMATIONS ---
